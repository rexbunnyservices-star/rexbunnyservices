services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - '8090:8090'
    volumes:
      - ./pb_data_fresh:/pb_data
    environment:
      - PB_ADMIN_EMAIL=admin@rexbunnyservices.com
      - PB_ADMIN_PASSWORD=Admin12345!
    restart: unless-stopped
    networks:
      - rexnet

  n8n:
    image: n8nio/n8n:latest
    ports:
      - '5678:5678'
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    env_file:
      - .env
    environment:
      - N8N_LOG_LEVEL=debug
      - N8N_SECURE_COOKIE=false
      - N8N_PROXY_HOPS=1
      - WEBHOOK_URL=https://n8n.rexbunnyservices.online
      - POCKETBASE_URL=http://pocketbase:8090
      - PB_EMAIL=n8n-service@rexbunnyservices.online
      - PB_PASSWORD=chSRTfvPpxoqgmC41YOFVdWz
      - SALES_ALERT_TO=help@rexbunnyservices.online
      - LISTMONK_URL=http://listmonk:9000
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_RUNNERS_TASK_TIMEOUT=900
    depends_on:
      - pocketbase
    restart: unless-stopped
    networks:
      - rexnet

  listmonk:
    image: listmonk/listmonk:latest
    ports:
      - '9000:9000'
    environment:
      - LISTMONK_ADMIN_EMAIL=admin@rexbunnyservices.online
      - LISTMONK_ADMIN_PASSWORD=R3xBunnyL1stMonk!2024$$
      - LISTMONK_ADMIN_API_USER=listmonk-api
      - LISTMONK_ADMIN_API_PASSWORD=R3xBunnyL1stMonk!2024$$
    volumes:
      - ./listmonk/config.toml:/listmonk/config.toml
    depends_on:
      listmonk-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rexnet

  listmonk-db:
    image: postgres:15-alpine
    environment:
      - N8N_LOG_LEVEL=debug
      - POSTGRES_DB=listmonk
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./listmonk_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U listmonk']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rexnet

  calcom:
    image: calcom/cal.com:latest
    ports:
      - '3001:3000'
    environment:
      - N8N_LOG_LEVEL=debug
      - DATABASE_URL=postgresql://calcom:${POSTGRES_PASSWORD:-changeme}@calcom-db:5432/calcom
      - DATABASE_DIRECT_URL=postgresql://calcom:${POSTGRES_PASSWORD:-changeme}@calcom-db:5432/calcom
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme}
      - CALENDSO_ENCRYPTION_KEY=${CALENDSO_ENCRYPTION_KEY:-changeme}
      - NEXTAUTH_URL=https://cal.rexbunnyservices.online
    depends_on:
      calcom-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rexnet

  calcom-db:
    image: postgres:15-alpine
    environment:
      - N8N_LOG_LEVEL=debug
      - POSTGRES_DB=calcom
      - POSTGRES_USER=calcom
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./calcom_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calcom']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rexnet

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - '3002:3000'
    environment:
      - N8N_LOG_LEVEL=debug
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${POSTGRES_PASSWORD:-changeme}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_SECRET:-umami_secret_change_me}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rexnet

  umami-db:
    image: postgres:15-alpine
    environment:
      - N8N_LOG_LEVEL=debug
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./umami_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rexnet

  smm-service:
    build:
      context: ./social-media-manager
      dockerfile: Dockerfile
    ports:
      - '3456:3456'
    env_file:
      - ./social-media-manager/.env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./social-media-manager/data:/app/data
    depends_on:
      - pocketbase
      - ollama
    restart: unless-stopped
    networks:
      - rexnet

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - C:\Users\anass\.ollama\models:/root/.ollama/models
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - rexnet

  traefik:
    image: traefik:v3.0
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./traefik/config.yml:/etc/traefik/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - n8n
      - listmonk
      - calcom
      - umami
      - smm-service
    restart: unless-stopped
    networks:
      - rexnet

  reacher:
    image: reacherhq/backend:latest
    ports:
      - '8081:8080'
    environment:
      - RUST_LOG=reacher=info
      - RCH__HELLO_NAME=rexbunnyservices.online
      - RCH__FROM_EMAIL=verify@rexbunnyservices.online
      - RCH__SMTP_TIMEOUT=15
    restart: unless-stopped
    networks:
      - rexnet

  gmaps-scraper:
    image: gosom/google-maps-scraper
    command: ['-web', '-addr', ':8080', '-data-folder', '/gmapsdata']
    ports:
      - '8082:8080'
    volumes:
      - ./gmapsdata:/gmapsdata
    environment:
      - DISABLE_TELEMETRY=1
    restart: unless-stopped
    networks:
      - rexnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared
      - C:\Users\anass\.cloudflared\3562b277-2a7e-4ab9-9b51-90b7e267ac76.json:/etc/cloudflared/credentials.json
      - C:\Users\anass\.cloudflared\cert.pem:/etc/cloudflared/cert.pem
    depends_on:
      - pocketbase
      - n8n
      - listmonk
      - calcom
      - umami
      - smm-service
    restart: unless-stopped
    networks:
      - rexnet

  # Internal SMTP relay that injects RFC 8058 one-click List-Unsubscribe
  # headers, then relays to Titan. Needed because n8n's Email Send node
  # cannot set custom message headers.
  # Bound to 127.0.0.1 only (for host-side debugging) + reachable by n8n
  # over the internal rexnet network. Do NOT publish 0.0.0.0.
  smtp-header-relay:
    build: ./smtp-header-relay
    container_name: rex-bunny-services-smtp-header-relay-1
    ports:
      - '127.0.0.1:2525:2525'
    env_file:
      - .env
    environment:
      - RELAY_BIND_HOST=0.0.0.0
      - RELAY_BIND_PORT=2525
      - RELAY_LOG_LEVEL=INFO
    depends_on: []
    restart: unless-stopped
    networks:
      - rexnet

networks:
  rexnet:
    driver: bridge
