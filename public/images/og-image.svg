<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="patternGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Logo R -->
  <rect x="140" y="200" width="100" height="100" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>
  <text x="190" y="280" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="url(#accentGrad)">R</text>
  <!-- Title -->
  <text x="320" y="260" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">RexBunny</text>
  <text x="320" y="320" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">Services</text>
  <!-- Tagline -->
  <text x="320" y="380" font-family="'Inter', system-ui, sans-serif" font-size="28" fill="url(#accentGrad)" font-weight="600">AI Search &amp; Marketing Agency</text>
  <text x="320" y="420" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#9ca3af">SEO · GEO · AEO · Web Development · AI Visual</text>
  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="url(#patternGrad)"/>
  <circle cx="50" cy="580" r="150" fill="url(#patternGrad)"/>
  <circle cx="1150" cy="500" r="100" fill="url(#patternGrad)"/>
</svg>
