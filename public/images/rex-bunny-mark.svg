  <circle cx="74" cy="48" r="2.5" fill="#fff" opacity="0.9"/>
  <!-- Left ear -->
  <ellipse cx="45" cy="38" rx="8" ry="22" transform="rotate(-18 45 38)" fill="#1a1a2e"/>
  <ellipse cx="45" cy="38" rx="4.5" ry="16" transform="rotate(-18 45 38)" fill="#ffedd5"/>
  <!-- Right ear -->
  <ellipse cx="75" cy="38" rx="8" ry="22" transform="rotate(18 75 38)" fill="#1a1a2e"/>
