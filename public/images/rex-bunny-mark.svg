  <!-- Whiskers -->
  <line x1="32" y1="76" x2="42" y2="78" stroke="#1a1a2e" stroke-width="1.2" opacity="0.4"/>
  <line x1="32" y1="82" x2="42" y2="82" stroke="#1a1a2e" stroke-width="1.2" opacity="0.4"/>
  <line x1="88" y1="76" x2="78" y2="78" stroke="#1a1a2e" stroke-width="1.2" opacity="0.4"/>
