name: Set PB_PASSWORD (one-off)

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set PB_PASSWORD and N8N_PASSWORD on the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PB_PASSWORD: ${{ secrets.PB_PASSWORD }}
          N8N_PASSWORD: ${{ secrets.N8N_PASSWORD }}
        run: |
          npx wrangler@3 pages secret put PB_PASSWORD \
            --project-name=rex-bunny-services <<< "$PB_PASSWORD"
          npx wrangler@3 pages secret put N8N_PASSWORD \
            --project-name=rex-bunny-services <<< "$N8N_PASSWORD"
          npx wrangler@3 pages secret list --project-name=rex-bunny-services
